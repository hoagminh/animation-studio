      (function () {
        try {
          var currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var makeFetchWritable = function (target) {
            if (!target) return;
            var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
            if (desc && desc.configurable !== false && (!desc.writable && !desc.set)) {
              var getter = desc.get;
              var val = getter ? getter.call(window) : desc.value || currentFetch;
              Object.defineProperty(target, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function () {
                  return val;
                },
                set: function (newVal) {
                  val = newVal;
                },
              });
            }
          };

          makeFetchWritable(window);
          makeFetchWritable(Window.prototype);

          var origDefineProperty = Object.defineProperty;
          Object.defineProperty = function (obj, prop, descriptor) {
            if (
              (obj === window || obj === Window.prototype) &&
              prop === 'fetch' &&
              descriptor &&
              descriptor.get &&
              !descriptor.set
            ) {
              var origGet = descriptor.get;
              var customVal = undefined;
              return origDefineProperty.call(this, obj, prop, {
                configurable: true,
                enumerable: descriptor.enumerable !== false,
                get: function () {
                  return customVal !== undefined ? customVal : origGet.call(this);
                },
                set: function (v) {
                  customVal = v;
                },
              });
            }
            return origDefineProperty.call(this, obj, prop, descriptor);
          };

          window.addEventListener(
            'error',
            function (e) {
              var msg = (e && e.message) || '';
              var file = (e && e.filename) || '';
              if (
                msg.indexOf('Cannot set property fetch') !== -1 ||
                file.indexOf('chrome-extension://') === 0
              ) {
                e.stopImmediatePropagation();
                e.preventDefault();
                return false;
              }
            },
            true
          );
        } catch (_) {}
      })();
